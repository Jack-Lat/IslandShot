name: IslandShot
options:
  bundleIdPrefix: app.islandshot
  deploymentTarget:
    iOS: "17.0"
targets:
  IslandShot:
    type: application
    platform: iOS
    sources:
      - path: IslandShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.islandshot.app
        PRODUCT_NAME: IslandShot
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # Info.plist генерирует сам Xcode из ключей ниже.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IslandShot
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "IslandShot сохраняет готовые скриншоты в вашу медиатеку."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
schemes:
  IslandShot:
    build:
      targets:
        IslandShot: all
    run:
      config: Debug
    archive:
      config: Release
